<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LIMUN Sessions App</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/session.css">
    <style>
        /* background photo with a dark tint so the text stays readable -
               change .7 to make the tint lighter (0) or darker (1) */
        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;

            background-image:
                linear-gradient(rgba(14, 10, 32, .7), rgba(14, 10, 32, .7)),
                url('assets/houses-of-parliament.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        main {
            flex: 1;
        }

        footer {
            padding: 1rem;
            text-align: center;
        }

        a {
            color: var(--gold-1);
            font-weight: bold;
        }

        .topbar {
            grid-template-columns: 1fr;
        }

        /* no avatar here, so the brand can use the full width */
        .topbar-item {
            margin-left: 1px;
            white-space: nowrap;
        }

        .layout {
            max-width: 1000;
            padding: 48px 28px 40px;
        }

        .home-hero {
            text-align: center;
            padding: 8px 0 4px;
        }

        .home-hero img {
            height: 76px;
            width: auto;
            margin-bottom: 18px;
        }

        .home-hero h1 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .home-hero .subtitle {
            max-width: 520px;
            margin: 0 auto;
            font-size: .95rem;
            line-height: 1.5;
        }

        .paths {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .path-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 24px;
        }

        .path-card .k {
            margin-bottom: 0;
        }

        .path-card h2 {
            font-family: var(--serif);
            font-weight: 400;
            font-size: 1.3rem;
        }

        .path-card p {
            font-size: .85rem;
            color: var(--muted);
            line-height: 1.5;
            flex: 1;
        }

        .path-card .submit-btn {
            margin-top: 8px;
        }

        @media (max-width: 700px) {
            .layout {
                padding: 32px 16px;
            }

            .paths {
                grid-template-columns: 1fr;
            }

            .home-hero h1 {
                font-size: 1.6rem;
            }
        }

        .country-preset {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 2px;

            box-shadow: 0px 0px 0px 1px;
            border: black;
            border-width: 1px;
            border-radius: 1px;

            cursor: pointer;
        }

        .listbox {
            height: 200px;
            overflow-x: hidden;
            overflow-y: auto;
            border: 1px solid #888;
            border-radius: 4px;
            padding: 2px;
        }

        .list-item {
            padding: 4px 8px;
            margin-bottom: 2px;
            height: 24px;
            box-sizing: border-box;

            cursor: pointer;
            user-select: none;

            display: flex;
            align-items: center;
        }

        .list-item img {
            width: 32px;
            height: 24px;
        }

        .list-item:hover {
            background-color: var(--hair);
        }

        .list-item.selected {
            background-color: var(--circle);
        }

        .voting button {
            filter: brightness(0.4);
            box-shadow: none;
            cursor: pointer;

            color: black;
            width: 20px;
            height: 20px;
            padding: 3px;
            margin-right: 1px;
        }

        .voting button.selected {
            filter: brightness(1.0);
        }

       .file-actions {
          display: flex;
          gap: 8px;
          font-family: sans-serif;
        }

        .file-menu {
          position: relative;
        }

        .file-menu > button {
          padding: 8px 14px;
          cursor: pointer;
        }

        .file-options {
          display: none;
          position: absolute;
          top: 100%;
          left: 0;
          min-width: 130px;
          padding: 6px;
          background: var(--elizabeth);
          border: 1px solid #ccc;
          border-radius: 6px;
          box-shadow: 0 4px 12px #0002;
          z-index: 10;
        }

        .file-menu:hover .file-options,
        .file-menu:focus-within .file-options {
          display: grid;
          gap: 4px;
        }

        .file-options button {
          padding: 8px;
          text-align: left;
          background: var(--indigo); 
          border: none;
          border-radius: 2px;
          cursor: pointer;
        }

        .file-options button:hover,
        .file-options button:focus-visible {
          background: var(--hair); 
        }

        .caucusTimer {
            font-size: x-large;
            font-weight: bolder;
        }
        .speakerTimer {
            font-size: xx-large;
            font-weight: bolder;
        }

        select {
            font-family: monospace;
        }

    </style>
</head>

<body class="topbar-only">
    <header>
        <div class="topbar" style="display: flex;">
            <div class="brand" style="width:100%; float: left;">
                <a href="index.html">
                    <img class="brand-logo" src="assets/logo.png">
                </a>
                LIMUN Sessions App
            </div>
            <div class="topbar-item">
                <a href="https://www.limun.org.uk">LIMUN Home</a>
            </div>
            <div class="topbar-item">
                <a href="https://www.limunportal.org.uk">Portal Home</a>
            </div>
        </div>
    </header>

    <main id="mainContent" class="layout">
    </main>

    <footer>
        <div class="card path-card" style="border-radius: 0px;">
            <p>Session information is checked for deletion an hour after last interaction.</p>
            <p>
                If you experience any technical issues, please contact
                <a href="mailto:limunportal@limun.org.uk">limunportal@limun.org.uk</a>
            </p>
        </div>
    </footer>

    <template id="sessionConfigTemplate">
        <section class="home-hero">
            <img src="assets/logo.png">
            <h1>Configure your Session</h1>
        </section>
        <section class="card path-card">
            <div style="display: flex; align-items: center;">
                <h1 style="white-space: nowrap;">Committee:</h1>
                <select id="committeeSelection" style="margin-left: 10px;"></select>
            </div>
            <div style="display: flex; align-items: center;">
                <h1 style="white-space: nowrap;">Committee Title:</h1>
                <input id="committeeTitle" style="margin-left: 10px;" placeholder="United Nations General Assembly">
            </div>
        </section>
        <section id="countrySelectionPresetCard" class="card path-card">
            <div class="k">Preset Country Groups</div>
            <div id="countrySelectionPresets" style="display: flex; gap: 16px; align-items: center;"></div>
        </section>
        <section id="countrySelectionCard" class="paths">
            <div class="card path-card">
                <div style="align-items: center; display: flex;">
                    <div class="k" style="white-space: nowrap;">Custom Members</div>
                    <input id="avaiableCountryCustom" style="margin-left: 12px; margin-right: 5px;" placeholder="Enter name">
                    <button id="avaiableCountryCreateCustom">Create</button>
                </div>
                <div style="align-items: center; display: flex;">
                    <div class="k" style="white-space: nowrap; margin-right: 5px;">UN Member States</div>
                    <input id="availableCountrySearch" placeholder="Search">
                </div>
                <div id="availableCountryList" class="listbox"></div>
            </div>
            <div class="card path-card">
                <div style="align-items: center; display: flex;">
                    <div id="selectedCountries" class="k" style="width: 100%;">Selected Countries</div>
                    <button id="clearSelection" style="white-space: nowrap;">Clear Selection</button>
                </div>
                <div id="selectedCountryList" class="listbox" style="align-items: stretch;"></div>
            </div>
        </section>
        <section class="paths"> 
            <div class="file-menu">
                <button id="saveSessionFile" type="button" class="submit-btn">Save Configuration</button>
                <div class="file-options" id="to_file">
                    <button data-type="json">JSON</button>
                    <button data-type="csv">CSV</button>
                    <button data-type="txt">Text</button>
                </div>
            </div>
            <div class="file-menu">
                <button id="loadSessionFile" type="button" class="submit-btn">Load Configuration</button>
                <div class="file-options" id="from_file">
                    <button data-type="json">JSON</button>
                    <button data-type="csv">CSV</button>
                    <button data-type="txt">Text</button>
                </div>
            </div>
        <input
          type="file"
          id="file_input"
          accept=".json,.csv,.txt"
          hidden
        />
        </section>
        <button id="createSession" class="submit-btn">Create session</button>
    </template>
    <template id="sessionGSLTemplate">
        <dialog id="gslSettingsDialog" class="gsl-settings-dialog">
            <form id="gslSettingsForm">
                <h2>GSL Settings</h2>
                <label for="speakerTimeMinutes">Individual speaker time</label>

                <div class="speaker-time-inputs">
                <input
                    id="speakerTimeMinutes"
                    type="number"
                    min="0"
                    max="59"
                    value="1"
                >
                <span>min</span>
                <input
                    id="speakerTimeSeconds"
                    type="number"
                    min="0"
                    max="59"
                    value="30"
                >
                <span>sec</span>
                </div>

                <div class="dialog-actions">
                <button type="button" id="cancelGslSettings">Cancel</button>
                <button type="submit">Save settings</button>
                </div>
            </form>
        </dialog>        
        <section class="gsl-layout">
            <!-- Main timer and speaker list -->
            <div class="card path-card gsl-main-card">
                <div class="gsl-timer">
                    <h1 id="speakerTimeRemaining">0:00 / 0:00</h1>
                </div>

                <div class="gsl-controls">
                    <button id="startSpeaker" class="gsl-control gsl-navy" title="Start">▷</button>
                    <button id="restartSpeaker" class="gsl-control gsl-blue" title="Restart">↻</button>
                    <button id="gslSpeakers" class="gsl-control gsl-dark" title="Speakers">♙</button>
                    <button id="gslSettings" class="gsl-control gsl-gold" title="Settings">⚙</button>
                </div>

                <div class="gsl-section-heading">
                    <span>Current Speaker</span>
                    <button id="nextSpeaker" class="gsl-next-button">Next Speaker</button>
                </div>

                <div id="currentSpeaker" class="gsl-current-speaker">
                    <span class="gsl-placeholder-logo">🌐</span>
                    <span>Add Speakers</span>
                </div>

                <div class="gsl-upcoming-heading">Upcoming Speakers</div>
                <div id="upcomingSpeakers"></div>
            </div>

            <!-- Add speaker panel -->
            <div class="card path-card gsl-speaker-card">
                <h2>Add Speaker</h2>

                <input
                    id="availableCountrySearch"
                    class="gsl-search"
                    placeholder="⌕   Search"
                    type="search"
                >

                <div id="selectedCountryList" class="listbox gsl-speaker-list"></div>
            </div>
        </section>

        <!-- Bottom navigation -->
        <nav class="gsl-bottom-nav">
            <button class="gsl-nav-item active" data-tab="gsl">
                <span>⌂</span>
                <small>GSL</small>
            </button>
            <button id="motionsView" class="gsl-nav-item" data-tab="motions">
                <span>♟</span>
                <small>Motions</small>
            </button>
            <button class="gsl-nav-item" data-tab="mod">
                <span>◯</span>
                <small>Mod</small>
            </button>
            <button class="gsl-nav-item" data-tab="unmod">
                <span>◉</span>
                <small>Unmod</small>
            </button>
            <button class="gsl-nav-item" data-tab="single-speaker">
                <span>♩</span>
                <small>Single Speaker</small>
            </button>
            <button class="gsl-nav-item" data-tab="vote">
                <span>▥</span>
                <small>Vote</small>
            </button>
        </nav>
    </template>
    <template id="sessionMotionsTemplate">
        <section class="motions-panel">
        <div class="motions-header">
            <h2>Motions</h2>
            <button type="button" id="openMotionDialog">
                Submit motion
            </button>
        </div>

        <div id="motionList" class="motion-list">
            <p>No motions have been submitted.</p>
        </div>
        </section>

        <dialog id="motionDialog" class="motion-dialog">
            <form id="motionForm">
                <h2>Submit a motion</h2>

            <label for="motionType">Motion type</label>
            <select id="motionType" name="type" required>
            <option value="">Select a motion</option>

            <optgroup label="Agenda and Debate">
                <option value="set_agenda">Set agenda item first</option>
                <option value="previous_question">Move to the previous question</option>
                <option value="consultation_whole">Consultation of the whole</option>
                <option value="suspend_debate">Suspend debate</option>
                <option value="resume_debate">Resume debate</option>
                <option value="close_debate">Close debate</option>
                <option value="suspend_meeting">Suspend the meeting</option>
                <option value="adjourn_meeting">Adjourn the meeting</option>
            </optgroup>

            <optgroup label="Caucuses">
                <option value="moderated_caucus">Moderated caucus</option>
                <option value="unmoderated_caucus">Unmoderated caucus</option>
                <option value="extend_caucus">Extend a caucus</option>
            </optgroup>

            <optgroup label="Working Papers and Resolutions">
                <option value="introduce_working_paper">Introduce working paper</option>
                <option value="introduce_draft_resolution">Introduce draft resolution</option>
                <option value="introduce_amendment">Introduce amendment</option>
                <option value="introduce_friendly_amendment">
                Introduce friendly amendment
                </option>
            </optgroup>

            <optgroup label="Voting Procedure">
                <option value="split_house">Split the house</option>
                <option value="reorder_resolutions">Reorder draft resolutions</option>
                <option value="division_question">Division of the question</option>
                <option value="roll_call_vote">Roll call vote</option>
                <option value="recount_vote">Request a recount</option>
            </optgroup>

            <optgroup label="Rulings and Other Motions">
                <option value="appeal_dais">Appeal a decision of the Dais</option>
                <option value="other">Other motion</option>
            </optgroup>
            </select>

                <label for="motionTopic">Topic / purpose</label>
                <input
                id="motionTopic"
                name="topic"
                type="text"
                placeholder="Enter the motion topic"
                >

                <div id="motionDurationFields">
                <label for="totalDuration">Total duration (minutes)</label>
                <input
                    id="totalDuration"
                    name="duration"
                    type="number"
                    min="1"
                    max="120"
                    value="10"
                >

                <div id="speakerDurationField">
                    <label for="speakerDuration">
                    Individual speaking time (seconds)
                    </label>
                    <input
                    id="speakerDuration"
                    name="speakerDuration"
                    type="number"
                    min="1"
                    max="600"
                    value="60"
                    >
                </div>
                </div>

                <label for="motionProposer">Proposed by</label>
                <input
                id="motionProposer"
                name="proposedBy"
                type="text"
                placeholder="Country or delegate"
                required
                >

                <div class="motion-dialog-actions">
                <button type="button" id="cancelMotion">Cancel</button>
                <button type="submit">Submit motion</button>
                </div>
            </form>
        </dialog>
    </template>
    <template id="sessionAppTemplate">
        <button id="setupSession" class="submit-btn">Config</button>
        <div class="card path-card" style="align-items: center;">
            <h1 class="caucusTimer" id="caucusTimeRemaining">1:00 / 1:00</h1>
            <h1 class="speakerTimer" id="speakerTimeRemaining">1:00 / 1:00</h1>
            <div>
                <button id="startSpeaker" class="card">Start</button>
                <button id="stopSpeaker" class="card">Stop</button>
                <button id="restartSpeaker" class="card">Restart</button>
            </div>
        </div>
        <div class="card path-card">
            <div style="align-items: center; display: flex;">
                <div id="selectedCountries" class="k" style="width: 100%;">Selected Countries</div>
            </div>
            <div id="selectedCountryList" class="listbox" style="align-items: stretch;"></div>
        </div>
    </template>
    <script type="module" src="static/js/main.js" ></script>
</body>

</html>
